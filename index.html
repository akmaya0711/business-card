<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 1번: 검색 로봇 및 크롤러 수집 차단 -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>MAENG YOUNGJAE - Digital Business Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .card-container {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      padding: 28px 22px;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    .brand-title {
      font-size: 13px;
      letter-spacing: 2px;
      color: #475569;
      text-transform: uppercase;
      margin-bottom: 18px;
      font-weight: 700;
    }
    .tab-buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      background: #f8fafc;
      padding: 5px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }
    .card-flip-wrap {
      perspective: 1200px;
      width: 100%;
      margin-bottom: 22px;
    }
    .card-flipper {
      position: relative;
      width: 100%;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }
    .card-flipper.flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      line-height: 0;
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }
    .card-face.back {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotateY(180deg);
    }
    .card-img {
      width: 100%;
      height: auto;
      display: block;
    }
    .info-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 20px 18px;
      text-align: left;
      margin-bottom: 18px;
    }
    .name-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .info-name {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.3px;
    }
    .name-logo {
      height: 60px;
      max-width: 50%;
      width: auto;
      object-fit: contain;
      mix-blend-mode: multiply;
      display: block;
    }
    .info-affiliation {
      font-size: 15px;
      font-weight: 700;
      color: #0369a1;
      margin-bottom: 2px;
    }
    .info-title {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 16px;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      font-size: 13px;
      border-top: 1px dashed #cbd5e1;
    }
    .info-label {
      color: #64748b;
      font-weight: 600;
      min-width: 60px;
    }
    .info-value {
      color: #0f172a;
      font-weight: 700;
      text-decoration: none;
      text-align: right;
      word-break: break-all;
    }

    /* 휴대전화 보호 전용 레이아웃 */
    .secure-mobile-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-reveal {
      background-color: #e0f2fe;
      color: #0284c7;
      border: 1px solid #bae6fd;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-reveal:active {
      transform: scale(0.95);
      background-color: #bae6fd;
    }

    .address-box {
      border-top: 1px dashed #cbd5e1;
      padding-top: 10px;
      margin-top: 2px;
      font-size: 12px;
      color: #475569;
      line-height: 1.5;
      font-weight: 500;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 0;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .btn-call {
      background-color: #0284c7;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }
    .btn-email {
      background-color: #0f172a;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }
    .btn-profile {
      width: 100%;
      background-color: #ffffff;
      color: #0f172a;
      border: 1.5px solid #0f172a;
      margin-bottom: 10px;
    }
    .btn-profile:hover {
      background-color: #f8fafc;
    }
    .btn-download {
      width: 100%;
      background-color: #f8fafc;
      color: #475569;
      border: 1px solid #cbd5e1;
      font-size: 13px;
    }
    .icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="brand-title">Samsung Securities</div>

    <div class="tab-buttons">
      <button class="tab-btn active" id="btnKo" onclick="setCard('ko')">국문 명함</button>
      <button class="tab-btn" id="btnEn" onclick="setCard('en')">English</button>
    </div>

    <div class="card-flip-wrap">
      <div class="card-flipper" id="cardFlipper">
        <div class="card-face front">
          <img class="card-img" src="name_card_korean.jpg" alt="국문 명함">
        </div>
        <div class="card-face back">
          <img class="card-img" src="name_card_english.jpg" alt="영문 명함">
        </div>
      </div>
    </div>

    <div class="info-box">
      <div class="name-header">
        <div id="personName" class="info-name">맹 영 재</div>
        <img class="name-logo" src="logo.jpg" alt="Samsung Financial Networks">
      </div>
      <div id="personAffiliation" class="info-affiliation">삼성증권 리서치SA팀</div>
      <div id="personTitle" class="info-title">수석</div>
      
      <!-- 휴대전화: 마스킹 및 보안 처리 -->
      <div class="info-item">
        <span class="info-label">Mobile</span>
        <div class="secure-mobile-wrap">
          <span id="phoneMobile" class="info-value">010.••••.0198</span>
          <button type="button" id="revealBtn" class="btn-reveal" onclick="revealMobile()">보기</button>
        </div>
      </div>

      <div class="info-item">
        <span class="info-label">Office</span>
        <a id="phoneOffice" class="info-value" href="tel:0220207055">02.2020.7055</a>
      </div>
      <div class="info-item">
        <span class="info-label">Email</span>
        <a id="emailText" class="info-value" href="mailto:akmaya@samsung.com">akmaya@samsung.com</a>
      </div>
      <div class="address-box" id="addressText">
        서울특별시 서초구 서초대로 74길 11 (서초동, 삼성전자빌딩) 10층
      </div>
    </div>

    <div class="btn-group">
      <!-- 휴대전화 통화: 터치 시 번호 조합 후 연결 -->
      <a id="callBtn" class="btn btn-call" href="#" onclick="handleCallClick(event)">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        <span id="callLabel">휴대전화 통화</span>
      </a>
      <a id="emailBtn" class="btn btn-email" href="mailto:akmaya@samsung.com">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        <span id="emailLabel">이메일 작성</span>
      </a>
    </div>

    <a id="profileBtn" class="btn btn-profile" href="https://akmaya0711.github.io/profile/">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span id="profileLabel">프로필 소개 보기</span>
    </a>

    <a id="downloadBtn" class="btn btn-download" href="name_card_korean.jpg" download>
      <svg class="icon" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
      <span id="downloadLabel">명함 이미지 저장</span>
    </a>
  </div>

  <script>
    let currentLang = 'ko';
    let isMobileUnmasked = false;

    /* 수집 봇 방지를 위해 휴대전화 번호를 조각화하여 보관 */
    const mobileParts = {
      p1: '010',
      p2: '9089',
      p3: '0198',
      country: '+82'
    };

    function getRealMobile(format) {
      if (format === 'raw') {
        return mobileParts.p1 + mobileParts.p2 + mobileParts.p3;
      }
      if (format === 'en') {
        return mobileParts.country + '.' + '10' + '.' + mobileParts.p2 + '.' + mobileParts.p3;
      }
      return mobileParts.p1 + '.' + mobileParts.p2 + '.' + mobileParts.p3;
    }

    const profileData = {
      ko: {
        name: "맹 영 재",
        affiliation: "삼성증권 리서치SA팀",
        title: "수석",
        maskedMobile: "010.••••.0198",
        office: "02.2020.7055",
        officeRaw: "0220207055",
        email: "akmaya@samsung.com",
        address: "06620 서울특별시 서초구 서초대로 74길 11 (서초동, 삼성전자빌딩) 10층",
        callText: "휴대전화 통화",
        emailText: "이메일 작성",
        profileText: "프로필 소개 보기",
        downloadText: "국문 명함 저장",
        downloadFile: "name_card_korean.jpg",
        revealText: "보기"
      },
      en: {
        name: "MAENG YOUNGJAE",
        affiliation: "Samsung Securities",
        title: "Supervisory Analyst / Research SA Team",
        maskedMobile: "+82.10.••••.0198",
        office: "+82.2.2020.7055",
        officeRaw: "+82220207055",
        email: "akmaya@samsung.com",
        address: "10th fl., Samsung Electronics Bldg., 11, Seocho-daero 74-gil, Seocho-gu Seoul 06620, KOREA",
        callText: "Call Mobile",
        emailText: "Send Email",
        profileText: "View Profile",
        downloadText: "Save Card Image",
        downloadFile: "name_card_english.jpg",
        revealText: "Show"
      }
    };

    /* 휴대전화 번호 잠금 해제 및 표시 함수 */
    function revealMobile() {
      isMobileUnmasked = true;
      const phoneElem = document.getElementById('phoneMobile');
      const revealBtn = document.getElementById('revealBtn');
      const realNum = currentLang === 'ko' ? getRealMobile('ko') : getRealMobile('en');

      phoneElem.innerHTML = '<a href="tel:' + getRealMobile('raw') + '" style="color:#0284c7; text-decoration:none;">' + realNum + '</a>';
      revealBtn.style.display = 'none';

      document.getElementById('callBtn').href = 'tel:' + getRealMobile('raw');
    }

    /* 통화 버튼 클릭 시 즉시 번호 해제 후 통화 연결 */
    function handleCallClick(event) {
      if (!isMobileUnmasked) {
        revealMobile();
      }
      window.location.href = 'tel:' + getRealMobile('raw');
      event.preventDefault();
    }

    function setCard(lang) {
      currentLang = lang;
      const flipper = document.getElementById('cardFlipper');
      const btnKo = document.getElementById('btnKo');
      const btnEn = document.getElementById('btnEn');
      const data = profileData[lang];

      if (lang === 'ko') {
        flipper.classList.remove('flipped');
        btnKo.classList.add('active');
        btnEn.classList.remove('active');
      } else {
        flipper.classList.add('flipped');
        btnEn.classList.add('active');
        btnKo.classList.remove('active');
      }

      document.getElementById('personName').textContent = data.name;
      document.getElementById('personAffiliation').textContent = data.affiliation;
      document.getElementById('personTitle').textContent = data.title;

      const phoneElem = document.getElementById('phoneMobile');
      const revealBtn = document.getElementById('revealBtn');

      if (isMobileUnmasked) {
        const realNum = lang === 'ko' ? getRealMobile('ko') : getRealMobile('en');
        phoneElem.innerHTML = '<a href="tel:' + getRealMobile('raw') + '" style="color:#0284c7; text-decoration:none;">' + realNum + '</a>';
        revealBtn.style.display = 'none';
      } else {
        phoneElem.textContent = data.maskedMobile;
        revealBtn.textContent = data.revealText;
        revealBtn.style.display = 'inline-block';
      }

      const officeElem = document.getElementById('phoneOffice');
      officeElem.textContent = data.office;
      officeElem.href = 'tel:' + data.officeRaw;

      const emailElem = document.getElementById('emailText');
      emailElem.textContent = data.email;
      emailElem.href = 'mailto:' + data.email;

      document.getElementById('addressText').textContent = data.address;
      document.getElementById('callLabel').textContent = data.callText;
      document.getElementById('emailLabel').textContent = data.emailText;
      document.getElementById('profileLabel').textContent = data.profileText;

      const downloadBtn = document.getElementById('downloadBtn');
      downloadBtn.href = data.downloadFile;
      document.getElementById('downloadLabel').textContent = data.downloadText;
    }
  </script>

</body>
</html>
